<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Packrat mascot: chibi side-view with knapsack, smooth SVG curves -->
  <defs>
    <linearGradient id="fur2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d3a0"/>
      <stop offset="1" stop-color="#e3b877"/>
    </linearGradient>
    <linearGradient id="ear2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbcc9"/>
      <stop offset="1" stop-color="#f8a3b6"/>
    </linearGradient>
    <linearGradient id="sack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc55e"/>
      <stop offset="1" stop-color="#e8a232"/>
    </linearGradient>
  </defs>

  <!-- tail curling behind -->
  <path d="M 84 102 Q 108 100 112 88 Q 115 78 106 76"
        fill="none" stroke="#c99a5e" stroke-width="7" stroke-linecap="round"/>

  <!-- body -->
  <ellipse cx="52" cy="100" rx="30" ry="26" fill="url(#fur2)"/>

  <!-- feet -->
  <ellipse cx="40" cy="120" rx="10" ry="5" fill="#c99a5e"/>
  <ellipse cx="66" cy="120" rx="10" ry="5" fill="#c99a5e"/>

  <!-- knapsack on the back -->
  <g>
    <path d="M 72 42 Q 108 40 114 68 Q 118 92 96 98 Q 78 102 74 84 Q 70 60 72 42 Z"
          fill="url(#sack)"/>
    <path d="M 76 52 Q 106 50 112 70" fill="none" stroke="#d18d20"
          stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <!-- knot -->
    <path d="M 92 40 Q 88 30 80 28 M 92 40 Q 96 30 104 28"
          fill="none" stroke="#e07a7a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="92" cy="40" r="6.5" fill="#e07a7a"/>
  </g>

  <!-- ears -->
  <ellipse cx="30" cy="34" rx="13" ry="15" fill="url(#fur2)" transform="rotate(-16 30 34)"/>
  <ellipse cx="30" cy="35" rx="7" ry="9" fill="url(#ear2)" transform="rotate(-16 30 35)"/>
  <ellipse cx="60" cy="30" rx="13" ry="15" fill="url(#fur2)" transform="rotate(12 60 30)"/>
  <ellipse cx="60" cy="31" rx="7" ry="9" fill="url(#ear2)" transform="rotate(12 60 31)"/>

  <!-- head -->
  <circle cx="46" cy="62" r="33" fill="url(#fur2)"/>

  <!-- muzzle -->
  <ellipse cx="46" cy="76" rx="17" ry="13" fill="#fff5e2"/>

  <!-- eyes -->
  <ellipse cx="36" cy="58" rx="7" ry="8" fill="#3a3038"/>
  <ellipse cx="60" cy="58" rx="7" ry="8" fill="#3a3038"/>
  <circle cx="38.5" cy="55" r="2.6" fill="#ffffff"/>
  <circle cx="62.5" cy="55" r="2.6" fill="#ffffff"/>

  <!-- nose -->
  <ellipse cx="46" cy="70" rx="5" ry="3.6" fill="#f0889a"/>

  <!-- mouth -->
  <path d="M 46 74 Q 46 79 40.5 78 M 46 74 Q 46 79 51.5 78" fill="none"
        stroke="#6b5544" stroke-width="2" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="26" cy="70" rx="6.5" ry="4" fill="#ff9aa8" opacity="0.55"/>
  <ellipse cx="68" cy="70" rx="6.5" ry="4" fill="#ff9aa8" opacity="0.55"/>

  <!-- whiskers -->
  <g stroke="#b08d5c" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M 24 78 Q 16 76 11 78"/>
    <path d="M 24 82 Q 16 83 12 86"/>
    <path d="M 68 78 Q 76 76 81 78"/>
    <path d="M 68 82 Q 76 83 80 86"/>
  </g>
</svg>
