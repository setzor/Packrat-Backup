<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Packrat mascot: kawaii front-facing, smooth SVG curves -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c288"/>
      <stop offset="1" stop-color="#dfa96c"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb7c5"/>
      <stop offset="1" stop-color="#f8a1b4"/>
    </linearGradient>
    <linearGradient id="bundle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d8ee0"/>
      <stop offset="1" stop-color="#4f6fc4"/>
    </linearGradient>
  </defs>

  <!-- bundle resting on top of the head -->
  <g>
    <path d="M 44 26 Q 64 8 84 26 L 80 34 Q 64 22 48 34 Z" fill="url(#bundle)"/>
    <path d="M 50 27 Q 64 17 78 27 L 75 32 Q 64 24 53 32 Z" fill="#8aa7ee" opacity="0.7"/>
    <circle cx="64" cy="10" r="5" fill="#e07a7a"/>
    <circle cx="56" cy="8" r="4" fill="#e07a7a"/>
    <circle cx="72" cy="8" r="4" fill="#e07a7a"/>
  </g>

  <!-- ears -->
  <g>
    <ellipse cx="34" cy="40" rx="15" ry="17" fill="url(#fur)" transform="rotate(-18 34 40)"/>
    <ellipse cx="34" cy="41" rx="8" ry="10" fill="url(#ear)" transform="rotate(-18 34 41)"/>
    <ellipse cx="94" cy="40" rx="15" ry="17" fill="url(#fur)" transform="rotate(18 94 40)"/>
    <ellipse cx="94" cy="41" rx="8" ry="10" fill="url(#ear)" transform="rotate(18 94 41)"/>
  </g>

  <!-- head -->
  <circle cx="64" cy="74" r="50" fill="url(#fur)"/>

  <!-- muzzle -->
  <ellipse cx="64" cy="90" rx="24" ry="17" fill="#fdf3e0"/>

  <!-- eyes -->
  <g>
    <ellipse cx="46" cy="70" rx="9" ry="10" fill="#3a3038"/>
    <ellipse cx="82" cy="70" rx="9" ry="10" fill="#3a3038"/>
    <circle cx="49" cy="66" r="3.2" fill="#ffffff"/>
    <circle cx="85" cy="66" r="3.2" fill="#ffffff"/>
    <circle cx="43.5" cy="73.5" r="1.4" fill="#ffffff" opacity="0.7"/>
    <circle cx="79.5" cy="73.5" r="1.4" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- nose -->
  <ellipse cx="64" cy="84" rx="6" ry="4.5" fill="#f0889a"/>

  <!-- mouth -->
  <path d="M 64 88 Q 64 94 58 93 M 64 88 Q 64 94 70 93" fill="none"
        stroke="#6b5544" stroke-width="2.2" stroke-linecap="round"/>

  <!-- teeth -->
  <path d="M 61 95 L 61 99 M 67 95 L 67 99" stroke="#fdf3e0" stroke-width="3"
        stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="32" cy="84" rx="8" ry="5" fill="#ff9aa8" opacity="0.55"/>
  <ellipse cx="96" cy="84" rx="8" ry="5" fill="#ff9aa8" opacity="0.55"/>

  <!-- whiskers -->
  <g stroke="#b08d5c" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M 36 92 Q 26 90 20 92"/>
    <path d="M 36 96 Q 26 97 21 100"/>
    <path d="M 92 92 Q 102 90 108 92"/>
    <path d="M 92 96 Q 102 97 107 100"/>
  </g>
</svg>
