name: APPIMAGE

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  appimage:
    name: AppImage x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip python3-dev curl file \
            libgl1 libegl1 libxkbcommon0 libxcb1 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 libfreetype6 patchelf \
            libpulse0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xkb1 libxcb-xinerama0 \
            libxkbcommon-x11-0 libxext6 libxrandr2 libxrender1 \
            libxi6 libxkbfile1 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1 libegl1-mesa-dri libgbm1 libdrm2
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build AppImage
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/appimage.sh
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Verify AppImage
        run: |
          chmod +x "dist/Packrat-Backup-${VERSION}-x86_64.AppImage"
          file "dist/Packrat-Backup-${VERSION}-x86_64.AppImage"
          "./dist/Packrat-Backup-${VERSION}-x86_64.AppImage" --appimage-extract > /dev/null
          test -f squashfs-root/AppRun
          test -f "squashfs-root/usr/share/applications/io.github.setzor.PackratBackup.desktop"
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: packrat-appimage-x86_64
          path: dist/
